<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMAA.Tech - Realtime Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #111; --secondary: #00d2ff; --bg: #f0f2f5; --text: #333; --gray: #777; --red: #e74c3c; --green: #2ecc71; --white: #fff; --border: #ddd; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
        #authScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; display: flex; justify-content: center; align-items: center; z-index: 9999; flex-direction: column;}
        .auth-box { background: var(--white); padding: 40px; border-radius: 15px; text-align: center; width: 100%; max-width: 450px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); border-top: 5px solid var(--secondary); }
        .google-btn { width: 100%; padding: 15px; background: #db4437; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 10px;}
        header { background: var(--primary); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 10px;}
        .logo { color: var(--secondary); font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 8px;}
        .logo span { color: #fff; }
        .header-actions { display: flex; gap: 10px; }
        .btn-outline { background: transparent; border: 1px solid var(--secondary); color: var(--secondary); padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--white); padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 25px; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--bg); }
        .btn-main { background: var(--primary); color: var(--secondary); border: 1px solid var(--secondary); padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { padding: 12px 20px; background: var(--white); border: 1px solid var(--border); border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .tab-btn.active { background: var(--primary); color: var(--secondary); border-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { background: var(--bg); font-weight: 700; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: var(--white); border-radius: 12px; padding: 15px; border: 1px solid var(--border); text-align: center; }
        .product-name { font-weight: 700; font-size: 16px; margin-bottom: 5px; }
        .product-price { font-size: 18px; font-weight: 900; color: var(--green); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .b-green { background: #d4edda; color: #155724; }
        .b-yellow { background: #fff3cd; color: #856404; }
        #loadingOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.95); display:none; justify-content:center; align-items:center; z-index:99999; flex-direction:column;}
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid var(--secondary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p style="margin-top: 15px; font-weight: bold; color: var(--primary);">جاري التحميل...</p>
    </div>

    <div id="authScreen">
        <div style="text-align: center; margin-bottom: 30px;">
            <h1 style="color: var(--secondary); font-size: 40px; font-weight: 900;"><i class="fas fa-shield-alt"></i> EMAA.Tech</h1>
            <p style="color: #aaa;">Realtime Database System</p>
        </div>
        <div class="auth-box">
            <h1>تسجيل الدخول للمحل</h1>
            <button class="google-btn" onclick="signInWithGoogle()">
                <i class="fab fa-google"></i> الدخول باستخدام Google
            </button>
        </div>
    </div>

    <div id="appScreen" style="display: none;">
        <header>
            <div class="logo"><i class="fas fa-shield-alt"></i> <span>EMAA.Tech</span></div>
            <div class="header-actions">
                <button class="btn-outline" onclick="logout()" style="border-color: var(--red); color: var(--red);"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </header>
        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('dashboard', this)"><i class="fas fa-chart-pie"></i> لوحة التحكم</button>
                <button class="tab-btn" onclick="switchTab('inventory', this)"><i class="fas fa-box"></i> المخزون</button>
                <button class="tab-btn" onclick="switchTab('pos', this)"><i class="fas fa-cash-register"></i> نقطة البيع</button>
            </div>

            <div id="tab-dashboard" class="tab-content active">
                <div class="card">
                    <h3 class="section-title">إحصائيات المحل</h3>
                    <p>إجمالي المنتجات: <strong id="statInventory">0</strong></p>
                    <p>إجمالي المبيعات: <strong id="statSales">0</strong> ج.م</p>
                </div>
            </div>

            <div id="tab-inventory" class="tab-content">
                <div class="card">
                    <h3 class="section-title">إضافة منتج</h3>
                    <form id="inventoryForm">
                        <div class="form-grid">
                            <div class="form-group"><label>اسم المنتج</label><input type="text" id="invName" required></div>
                            <div class="form-group"><label>الكمية</label><input type="number" id="invQty" required min="1" value="1"></div>
                            <div class="form-group"><label>سعر الشراء</label><input type="number" id="invCost" required min="1"></div>
                            <div class="form-group"><label>سعر البيع</label><input type="number" id="invPrice" required min="1"></div>
                        </div>
                        <button type="submit" class="btn-main" style="margin-top: 15px;">إضافة للمخزون</button>
                    </form>
                </div>
                <h3 class="section-title">المنتجات</h3>
                <div class="products-grid" id="productsGrid"></div>
            </div>

            <div id="tab-pos" class="tab-content">
                <div class="card">
                    <h3 class="section-title">عملية بيع</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>اختر المنتج</label>
                            <select id="posProduct" required></select>
                        </div>
                        <div class="form-group"><label>الكمية</label><input type="number" id="posQty" required min="1" value="1"></div>
                        <div class="form-group"><label>الإجمالي</label><input type="text" id="posTotal" readonly style="background: var(--bg); font-weight: bold; color: var(--green);"></div>
                    </div>
                    <button onclick="processSale()" class="btn-main" style="margin-top: 15px; background: var(--green); color: white; border: none;">تأكيد البيع</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyChgRxNBPBlb41TGSZmdsE03tGkGVFl7GI",
            authDomain: "emaa-core.firebaseapp.com",
            projectId: "emaa-core",
            databaseURL: "https://emaa-core-default-rtdb.firebaseio.com", // مهم جداً لـ Realtime DB
            storageBucket: "emaa-core.firebasestorage.app",
            messagingSenderId: "737196522441",
            appId: "1:737196522441:web:6bbcb456017e8484f7c618",
            measurementId: "G-MMGLP0E3EM"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database(); // Realtime DB
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        let currentUser = null;
        let productsRef = null;

        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }

        // الدخول بجوجل
        function signInWithGoogle() {
            showLoading(true);
            auth.signInWithPopup(provider).then((result) => {
                currentUser = result.user;
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'block';
                initApp();
                showLoading(false);
            }).catch((error) => {
                showLoading(false);
                alert("خطأ: " + error.message);
            });
        }

        function logout() {
            auth.signOut().then(() => window.location.reload());
        }

        function initApp() {
            // تحديد مسار البيانات الخاص بكل مستخدم (UID)
            productsRef = database.ref('stores/' + currentUser.uid + '/products');
            loadProducts();
            loadSales();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if(btn) btn.classList.add('active');
        }

        // إضافة منتج
        document.getElementById('inventoryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('invName').value;
            const qty = parseInt(document.getElementById('invQty').value);
            const cost = parseFloat(document.getElementById('invCost').value);
            const price = parseFloat(document.getElementById('invPrice').value);

            productsRef.push({ name, qty, cost, price }).then(() => {
                this.reset();
                alert('تم إضافة المنتج!');
            });
        });

        function loadProducts() {
            const grid = document.getElementById('productsGrid');
            const select = document.getElementById('posProduct');
            
            productsRef.on('value', (snapshot) => {
                grid.innerHTML = '';
                select.innerHTML = '<option value="">-- اختر منتج --</option>';
                
                snapshot.forEach((child) => {
                    const p = child.val();
                    const id = child.key;
                    
                    grid.innerHTML += `
                        <div class="product-card">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price">${p.price} ج.م</div>
                            <div style="margin-bottom: 10px;">المتاح: ${p.qty}</div>
                            <button class="btn-outline" style="color: red; border-color: red; padding: 5px 10px;" onclick="deleteProduct('${id}')">حذف</button>
                        </div>
                    `;
                    
                    if(p.qty > 0) {
                        select.innerHTML += `<option value="${id}">${p.name} (${p.qty}) - ${p.price} ج.م</option>`;
                    }
                });
            });
        }

        function deleteProduct(id) {
            if(confirm('حذف هذا المنتج؟')) {
                productsRef.child(id).remove();
            }
        }

        // البيع
        document.getElementById('posProduct').addEventListener('change', function() {
            const id = this.value;
            if(id) {
                productsRef.child(id).once('value').then(snap => {
                    const p = snap.val();
                    document.getElementById('posQty').value = 1;
                    document.getElementById('posTotal').value = p.price;
                });
            }
        });

        document.getElementById('posQty').addEventListener('input', function() {
            const id = document.getElementById('posProduct').value;
            const qty = parseInt(this.value) || 0;
            if(id) {
                productsRef.child(id).once('value').then(snap => {
                    const p = snap.val();
                    document.getElementById('posTotal').value = p.price * qty;
                });
            }
        });

        function processSale() {
            const id = document.getElementById('posProduct').value;
            const qty = parseInt(document.getElementById('posQty').value);
            if(!id || qty < 1) return alert('اختر منتجاً وكمية');

            productsRef.child(id).once('value').then(snap => {
                const p = snap.val();
                if(p.qty < qty) return alert('الكمية المتاحة لا تكفي!');
                
                const newQty = p.qty - qty;
                const saleAmount = p.price * qty;

                // خصم الكمية وتسجيل البيع
                productsRef.child(id).update({ qty: newQty });
                database.ref('stores/' + currentUser.uid + '/sales').push({
                    productName: p.name,
                    qty: qty,
                    total: saleAmount,
                    date: new Date().toLocaleString('ar-EG')
                });
                
                alert('تم البيع بنجاح!');
                document.getElementById('posProduct').value = '';
                document.getElementById('posTotal').value = '';
            });
        }

        function loadSales() {
            database.ref('stores/' + currentUser.uid + '/sales').on('value', snap => {
                let total = 0;
                snap.forEach(child => { total += child.val().total; });
                document.getElementById('statSales').innerText = total;
            });
        }

        // تشغيل الحالة
        auth.onAuthStateChanged(user => {
            if(user) {
                currentUser = user;
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'block';
                initApp();
            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
            }
        });
    </script>
</body>
</html>
