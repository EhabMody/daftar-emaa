<script>
/* ========== INVENTORY ========== */
document.getElementById('inventoryForm').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!hasPermission('manage_inventory'))return toast('لا تملك صلاحية','error');
  showLoading(true);
  try{
    const id=document.getElementById('invEditId').value;
    const file=document.getElementById('invImage').files[0];
    let image=null;
    if(file)image=await compressImage(file);
    const data={
      name:document.getElementById('invName').value.trim(),
      serial:document.getElementById('invSerial').value.trim(),
      qty:parseInt(document.getElementById('invQty').value),
      cost:parseFloat(document.getElementById('invCost').value),
      price:parseFloat(document.getElementById('invPrice').value),
      warranty:parseInt(document.getElementById('invWarranty').value)||0,
      branchId:currentBranchId
    };
    if(image)data.image=image;
    if(id){
      await db.collection('stores').doc(currentStoreData._id).collection('products').doc(id).update(data);
      toast('تم تحديث المنتج','success');
    }else{
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('stores').doc(currentStoreData._id).collection('products').add(data);
      toast('تمت الإضافة','success');
    }
    e.target.reset();
    document.getElementById('invEditId').value='';
    document.getElementById('invSubmitBtn').innerHTML='<i class="fas fa-plus"></i> إضافة المنتج';
  }catch(err){toast('خطأ: '+err.message,'error')}
  showLoading(false);
});
function renderProducts(){
  const grid=document.getElementById('productsGrid');
  const q=(document.getElementById('invSearch')?.value||'').trim().toLowerCase();
  const list=q?inventory.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.serial||'').toLowerCase().includes(q)):inventory;
  if(!list.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-box-open"></i><p>لا توجد منتجات</p></div>';return}
  grid.innerHTML=list.map(item=>{
    const img=item.image?`<img src="${item.image}" alt="${escapeHtml(item.name)}">`:`<i class="fas fa-mobile-alt"></i>`;
    const lowQty=item.qty<=2?'low':'ok';
    return `<div class="product-card">
      <div class="product-img">${img}<span class="product-qty-badge ${lowQty}">${item.qty}</span></div>
      <div class="product-info">
        <div class="product-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
        <div style="font-size:11px;color:var(--dev-blue);margin-bottom:5px">${escapeHtml(item.serial)}</div>
        <div class="product-price">${formatCurrency(item.price)}</div>
        <div class="product-cost">شراء: ${formatCurrency(item.cost)}</div>
        <div class="product-actions">
          <button class="btn-icon blue" onclick="editProduct('${item.id}')"><i class="fas fa-edit"></i></button>
          <button class="btn-icon red" onclick="deleteProduct('${item.id}')"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function editProduct(id){
  const p=inventory.find(x=>x.id===id);if(!p)return;
  document.getElementById('invEditId').value=id;
  document.getElementById('invName').value=p.name;
  document.getElementById('invSerial').value=p.serial;
  document.getElementById('invQty').value=p.qty;
  document.getElementById('invCost').value=p.cost;
  document.getElementById('invPrice').value=p.price;
  document.getElementById('invWarranty').value=p.warranty||0;
  document.getElementById('invSubmitBtn').innerHTML='<i class="fas fa-save"></i> حفظ التعديل';
  document.getElementById('inventoryForm').scrollIntoView({behavior:'smooth'});
}
function deleteProduct(id){
  confirmDialog('حذف هذا المنتج؟',()=>db.collection('stores').doc(currentStoreData._id).collection('products').doc(id).delete().then(()=>toast('تم الحذف','success')));
}

/* ========== POS ========== */
function togglePaymentForm(){
  const m=document.getElementById('paymentMethodSelect').value;
  document.getElementById('cashFormSection').style.display=m==='cash'?'block':'none';
  document.getElementById('installmentFormSection').style.display=m==='installment'?'block':'none';
}
function renderPosProducts(){
  const grid=document.getElementById('posProducts');
  const q=(document.getElementById('posSearch')?.value||'').trim().toLowerCase();
  const avail=inventory.filter(i=>i.qty>0&&(!q||(i.name||'').toLowerCase().includes(q)||(i.serial||'').toLowerCase().includes(q)));
  if(!avail.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-box-open"></i><p>لا توجد منتجات متاحة</p></div>';return}
  grid.innerHTML=avail.map(item=>{
    const img=item.image?`<img src="${item.image}" alt="${escapeHtml(item.name)}">`:`<div class="ph"><i class="fas fa-mobile-alt"></i></div>`;
    return `<div class="pos-product-card" onclick="addToCart('${item.id}')">
      ${img}<span class="qty-tag">${item.qty}</span>
      <div class="info"><div class="nm">${escapeHtml(item.name)}</div><div class="pr">${formatCurrency(item.price)}</div><div class="sr">${escapeHtml(item.serial)}</div></div>
    </div>`;
  }).join('');
}
function addToCart(id){
  const p=inventory.find(x=>x.id===id);if(!p)return;
  const existing=cart.find(c=>c.id===id);
  if(existing){
    if(existing.qty>=p.qty)return toast('الكمية المتاحة لا تكفي','warning');
    existing.qty++;
  }else{
    if(p.qty<1)return toast('غير متوفر','warning');
    cart.push({id,name:p.name,price:p.price,cost:p.cost,serial:p.serial,image:p.image||null,qty:1});
  }
  renderCart();
}
function renderCart(){
  const c=document.getElementById('cartContainer');
  if(!cart.length){c.innerHTML='<div class="empty-state" style="padding:20px"><i class="fas fa-shopping-cart"></i><p>السلة فارغة</p></div>';document.getElementById('cartTotal').innerText='0 ج.م';return}
  c.innerHTML=cart.map((item,i)=>{
    const img=item.image?`<img src="${item.image}">`:`<div class="ph"><i class="fas fa-mobile-alt"></i></div>`;
    return `<div class="cart-item">
      ${img}
      <div class="cart-item-info"><div class="name">${escapeHtml(item.name)}</div><div class="price">${formatCurrency(item.price)} × ${item.qty} = ${formatCurrency(item.price*item.qty)}</div></div>
      <div class="cart-item-qty">
        <button onclick="changeQty(${i},-1)">−</button>
        <input type="number" value="${item.qty}" min="1" onchange="setQty(${i},this.value)">
        <button onclick="changeQty(${i},1)">+</button>
        <button onclick="removeFromCart(${i})" style="background:var(--red);color:#fff;border-color:var(--red)">×</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('cartTotal').innerText=formatCurrency(cart.reduce((s,i)=>s+i.price*i.qty,0));
}
function changeQty(i,d){const it=cart[i];const p=inventory.find(x=>x.id===it.id);const nv=it.qty+d;if(nv<1)return removeFromCart(i);if(nv>p.qty)return toast('الكمية المتاحة لا تكفي','warning');it.qty=nv;renderCart()}
function setQty(i,v){const n=parseInt(v)||1;const p=inventory.find(x=>x.id===cart[i].id);if(n>p.qty)return toast('الكمية المتاحة لا تكفي','warning');cart[i].qty=Math.max(1,Math.min(n,p.qty));renderCart()}
function removeFromCart(i){cart.splice(i,1);renderCart()}

async function confirmCashSale(){
  if(!cart.length)return toast('السلة فارغة','warning');
  const client=document.getElementById('cashClientName').value.trim()||'عميل نقدي';
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  confirmDialog(`تأكيد بيع نقدي بإجمالي ${formatCurrency(total)}؟`,async()=>{
    showLoading(true);
    try{
      const batch=db.batch();
      const storeRef=db.collection('stores').doc(currentStoreData._id);
      cart.forEach(item=>{
        const s=storeRef.collection('sales').doc();
        batch.set(s,{
          productName:item.name,serial:item.serial,price:item.price,cost:item.cost,
          qty:item.qty,image:item.image,client,date:fmtDateTime(),branchId:currentBranchId,
          saleType:'cash',createdBy:currentUser.uid
        });
        const pRef=storeRef.collection('products').doc(item.id);
        const p=inventory.find(x=>x.id===item.id);
        batch.update(pRef,{qty:p.qty-item.qty});
      });
      await batch.commit();
      toast('تم البيع النقدي','success');
      cart=[];renderCart();document.getElementById('cashClientName').value='';
    }catch(e){toast('خطأ: '+e.message,'error')}
    showLoading(false);
  });
}
function calcInstallment(){
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const d=parseFloat(document.getElementById('downPayment').value)||0;
  const c=parseInt(document.getElementById('installmentsCount').value)||1;
  document.getElementById('instValueDisplay').value=(total>d&&c>0)?formatCurrency((total-d)/c):'';
}
async function confirmInstallmentSale(){
  if(!cart.length)return toast('السلة فارغة','warning');
  const name=document.getElementById('clientName').value.trim();
  const phone=document.getElementById('clientPhone').value.trim();
  const nid=document.getElementById('clientNid').value.trim();
  const addr=document.getElementById('clientAddress').value.trim();
  const gName=document.getElementById('guarantorName').value.trim();
  const gPhone=document.getElementById('guarantorPhone').value.trim();
  const gNid=document.getElementById('guarantorNid').value.trim();
  const down=parseFloat(document.getElementById('downPayment').value)||0;
  const count=parseInt(document.getElementById('installmentsCount').value);
  const startVal=document.getElementById('startDate').value;
  if(!name||!phone||!nid||!addr)return toast('أكمل بيانات العميل','warning');
  if(!/^01[0125][0-9]{8}$/.test(phone))return toast('رقم موبايل غير صحيح','warning');
  if(!/^[0-9]{14}$/.test(nid))return toast('رقم قومي غير صحيح','warning');
  if(!gName||!gPhone||!gNid)return toast('أكمل بيانات الضامن','warning');
  if(!startVal)return toast('اختر تاريخ أول قسط','warning');
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  if(down>=total)return toast('المقدم يجب أن يكون أقل من الإجمالي','warning');
  if(count<1)return toast('عدد الأقساط غير صحيح','warning');
  const start=new Date(startVal);
  const perInst=(total-down)/count;
  const installments=Array.from({length:count},(_,i)=>{
    const d=new Date(start);d.setMonth(d.getMonth()+i);
    return {id:i+1,dueDate:d.toISOString().split('T')[0],amount:perInst,paid:0,isPaid:false,payments:[]};
  });
  confirmDialog(`تأكيد تقسيط ${count} قسط بقيمة ${formatCurrency(perInst)}؟`,async()=>{
    showLoading(true);
    try{
      const storeRef=db.collection('stores').doc(currentStoreData._id);
      await storeRef.collection('clients').add({
        name,phone,nid,address:addr,gName,gPhone,gNid,
        products:cart.map(i=>({name:i.name,serial:i.serial,price:i.price,cost:i.cost,image:i.image,qty:i.qty})),
        product:cart.map(i=>i.name).join(', '),
        serial:cart.map(i=>i.serial).join(', '),
        productImage:cart[0]?.image||null,
        totalPrice:total,
        costPrice:cart.reduce((s,i)=>s+i.cost*i.qty,0),
        downPayment:down,
        installments,purchaseDate:fmtDateTime(),branchId:currentBranchId,
        createdBy:currentUser.uid
      });
      const batch=db.batch();
      cart.forEach(item=>{
        const p=inventory.find(x=>x.id===item.id);
        batch.update(storeRef.collection('products').doc(item.id),{qty:p.qty-item.qty});
      });
      await batch.commit();
      toast('تم حفظ التقسيط','success');
      cart=[];renderCart();
      ['clientName','clientPhone','clientNid','clientAddress','guarantorName','guarantorPhone','guarantorNid','downPayment','installmentsCount','startDate','instValueDisplay'].forEach(id=>document.getElementById(id).value='');
    }catch(e){toast('خطأ: '+e.message,'error')}
    showLoading(false);
  });
}

/* ========== CLIENTS ========== */
function renderClients(){
  const tbody=document.getElementById('clientsTableBody');
  const q=(document.getElementById('clientsSearch')?.value||'').trim().toLowerCase();
  const list=q?clients.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.phone||'').includes(q)):clients;
  if(!list.length){tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><i class="fas fa-users"></i><p>لا يوجد عملاء</p></div></td></tr>';return}
  tbody.innerHTML=list.map(c=>{
    const paid=(c.downPayment||0)+c.installments.reduce((s,i)=>s+(i.paid||0),0);
    const rem=c.totalPrice-paid;
    const pc=c.installments.filter(i=>i.isPaid).length;
    return `<tr>
      <td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.phone)}</td><td>${escapeHtml(c.product)}</td>
      <td>${formatCurrency(rem)}</td><td>${pc}/${c.installments.length}</td>
      <td><button class="btn-icon blue" onclick="viewClient('${c.id}')"><i class="fas fa-eye"></i></button>
          <button class="btn-icon green" onclick="openPayModal('${c.id}')"><i class="fas fa-money-bill"></i></button></td>
    </tr>`;
  }).join('');
}
function viewClient(id){
  const c=clients.find(x=>x.id===id);if(!c)return;
  const paid=(c.downPayment||0)+c.installments.reduce((s,i)=>s+(i.paid||0),0);
  const rem=c.totalPrice-paid;
  const img=c.productImage?`<img src="${c.productImage}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;margin-bottom:10px">`:'';
  openModal(`
    <div class="invoice-header">${img}<h2><i class="fas fa-user"></i> ${escapeHtml(c.name)}</h2><p>${escapeHtml(c.phone)} — ${escapeHtml(c.address||'')}</p></div>
    <div class="invoice-details">
      <p><span>المنتج:</span><b>${escapeHtml(c.product)}</b></p>
      <p><span>السيريال:</span><b>${escapeHtml(c.serial)}</b></p>
      <p><span>الإجمالي:</span><b>${formatCurrency(c.totalPrice)}</b></p>
      <p><span>المقدم:</span><b>${formatCurrency(c.downPayment)}</b></p>
      <p><span>المحصل:</span><b>${formatCurrency(paid)}</b></p>
      <p><span>المتبقي:</span><b style="color:var(--red)">${formatCurrency(rem)}</b></p>
      <p><span>الضامن:</span><b>${escapeHtml(c.gName||'—')} — ${escapeHtml(c.gPhone||'')}</b></p>
    </div>
    <h3 style="margin:15px 0 10px;font-size:15px">الأقساط</h3>
    <div class="table-wrapper"><table><thead><tr><th>#</th><th>الاستحقاق</th><th>المبلغ</th><th>المدفوع</th><th>الحالة</th></tr></thead><tbody>
    ${c.installments.map(i=>`<tr><td>${i.id}</td><td>${i.dueDate}</td><td>${formatCurrency(i.amount)}</td><td>${formatCurrency(i.paid)}</td><td>${i.isPaid?'<span class="badge b-green">مدفوع</span>':'<span class="badge b-yellow">متبقي</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <button class="print-btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
  `);
}
function openPayModal(id){
  const c=clients.find(x=>x.id===id);if(!c)return;
  const idx=c.installments.findIndex(i=>!i.isPaid);
  if(idx===-1)return toast('تم سداد كل الأقساط','info');
  const inst=c.installments[idx];
  const remaining=inst.amount-inst.paid;
  openModal(`
    <h2 style="margin-bottom:15px"><i class="fas fa-money-bill"></i> تحصيل قسط</h2>
    <div class="invoice-details">
      <p><span>العميل:</span><b>${escapeHtml(c.name)}</b></p>
      <p><span>القسط:</span><b>${idx+1}/${c.installments.length}</b></p>
      <p><span>المستحق:</span><b>${formatCurrency(remaining)}</b></p>
    </div>
    <div class="form-group" style="margin-top:15px"><label>المبلغ المحصّل</label>
      <input type="number" id="payAmount" value="${remaining.toFixed(2)}" min="0.01" step="0.01">
    </div>
    <button class="btn-main success" onclick="doPay('${id}',${idx})"><i class="fas fa-check"></i> تسجيل الدفعة</button>
  `);
}
function doPay(clientId,idx){
  const c=clients.find(x=>x.id===clientId);if(!c)return;
  const amt=parseFloat(document.getElementById('payAmount').value);
  const inst=c.installments[idx];
  const remaining=inst.amount-inst.paid;
  if(!amt||amt<=0)return toast('أدخل مبلغاً صحيحاً','warning');
  if(amt>remaining+0.01)return toast('المبلغ أكبر من المتبقي','warning');
  inst.paid+=amt;
  if(!inst.payments)inst.payments=[];
  inst.payments.push({amount:amt,date:fmtDateTime(),by:currentUser.uid});
  if(inst.paid>=inst.amount-0.01)inst.isPaid=true;
  db.collection('stores').doc(currentStoreData._id).collection('clients').doc(clientId)
    .update({installments:c.installments})
    .then(()=>{toast('تم تسجيل الدفعة','success');closeModal()})
    .catch(e=>toast('خطأ: '+e.message,'error'));
}
function renderLatePayments(){
  const tbody=document.getElementById('lateTableBody');
  const today=new Date();today.setHours(0,0,0,0);
  let lateCount=0;const rows=[];
  clients.forEach(c=>c.installments.forEach((inst,idx)=>{
    if(!inst.isPaid){
      const due=new Date(inst.dueDate);
      if(due<today){
        lateCount++;
        const days=Math.floor((today-due)/86400000);
        rows.push(`<tr><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.phone)}</td><td>${formatCurrency(inst.amount-inst.paid)}</td><td>${inst.dueDate}</td><td><span class="badge b-red">${days} يوم</span></td><td><button class="btn-icon green" onclick="openPayModal('${c.id}')">تحصيل</button></td></tr>`);
      }
    }
  }));
  document.getElementById('lateCount').innerText=lateCount;
  tbody.innerHTML=rows.length?rows.join(''):'<tr><td colspan="6"><div class="empty-state"><i class="fas fa-check-circle" style="color:var(--green)"></i><p>لا توجد متأخرات 🎉</p></div></td></tr>';
}

/* ========== CASH SALES LOG ========== */
function renderCashSales(){
  const tbody=document.getElementById('cashSalesBody');
  if(!cashSales.length){tbody.innerHTML='<tr><td colspan="6"><div class="empty-state"><i class="fas fa-receipt"></i><p>لا توجد مبيعات نقدية</p></div></td></tr>';return}
  const sorted=[...cashSales].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  tbody.innerHTML=sorted.map(s=>`<tr><td>${escapeHtml(formatDate(s.date))}</td><td>${escapeHtml(s.productName)}</td><td>${escapeHtml(s.serial)}</td><td>${escapeHtml(s.client)}</td><td>${formatCurrency(s.price*(s.qty||1))}</td><td><button class="btn-icon blue" onclick="printSale('${s.id}')"><i class="fas fa-receipt"></i></button></td></tr>`).join('');
}
function printSale(id){
  const s=cashSales.find(x=>x.id===id);if(!s)return;
  openModal(`
    <div class="invoice-header"><h2><i class="fas fa-shield-alt"></i> ${escapeHtml(currentStoreData.storeName||'')}</h2><p>${escapeHtml(currentStoreData.phone||'')} — ${escapeHtml(currentStoreData.address||'')}</p></div>
    <div class="invoice-details">
      <p><span>التاريخ:</span><b>${formatDate(s.date)}</b></p>
      <p><span>المنتج:</span><b>${escapeHtml(s.productName)}</b></p>
      <p><span>السيريال:</span><b>${escapeHtml(s.serial)}</b></p>
      <p><span>العميل:</span><b>${escapeHtml(s.client)}</b></p>
      <p><span>الإجمالي:</span><b style="color:var(--green)">${formatCurrency(s.price*(s.qty||1))}</b></p>
    </div>
    <div class="invoice-footer">شكراً لتعاملكم معنا</div>
    <button class="print-btn" onclick="window.print()"><i class="fas fa-print"></i> طباعة</button>
  `);
}

/* ========== EXPENSES ========== */
document.getElementById('expenseForm').addEventListener('submit',e=>{
  e.preventDefault();
  if(!hasPermission('manage_expenses'))return toast('لا تملك صلاحية','error');
  db.collection('stores').doc(currentStoreData._id).collection('expenses').add({
    desc:document.getElementById('expDesc').value.trim(),
    amount:parseFloat(document.getElementById('expAmount').value),
    category:document.getElementById('expCategory').value,
    date:document.getElementById('expDate').value,
    branchId:currentBranchId,createdBy:currentUser.uid
  }).then(()=>{toast('تم تسجيل المصروف','success');e.target.reset();document.getElementById('expDate').value=todayStr()});
});
function renderExpenses(){
  const tbody=document.getElementById('expensesBody');
  if(!expenses.length){tbody.innerHTML='<tr><td colspan="5"><div class="empty-state"><i class="fas fa-receipt"></i><p>لا توجد مصروفات</p></div></td></tr>';return}
  const cats={general:'عام',rent:'إيجار',salaries:'رواتب',utilities:'كهرباء ومياه',purchases:'مشتريات',other:'أخرى'};
  const sorted=[...expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  tbody.innerHTML=sorted.map(ex=>`<tr><td>${ex.date}</td><td>${escapeHtml(ex.desc)}</td><td><span class="badge b-blue">${cats[ex.category]||'عام'}</span></td><td>${formatCurrency(ex.amount)}</td><td><button class="btn-icon red" onclick="deleteExpense('${ex.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('');
}
function deleteExpense(id){confirmDialog('حذف المصروف؟',()=>db.collection('stores').doc(currentStoreData._id).collection('expenses').doc(id).delete().then(()=>toast('تم الحذف','success')))}

/* ========== DAILY CASH ========== */
function renderDailyCash(){
  const date=document.getElementById('cashDate').value||todayStr();
  const inst=clients.reduce((s,c)=>s+c.installments.reduce((a,i)=>{
    if(!i.payments)return a;
    return a+i.payments.filter(p=>(p.date||'').startsWith(date)).reduce((x,p)=>x+p.amount,0);
  },0),0);
  const cash=cashSales.filter(s=>(s.date||'').startsWith(date)).reduce((s,x)=>s+(x.price*(x.qty||1)),0);
  const exp=expenses.filter(e=>e.date===date).reduce((s,x)=>s+x.amount,0);
  document.getElementById('dailyInst').innerText=formatCurrency(inst);
  document.getElementById('dailyCash').innerText=formatCurrency(cash);
  document.getElementById('dailyExp').innerText=formatCurrency(exp);
  document.getElementById('dailyNet').innerText=formatCurrency(inst+cash-exp);
}

/* ========== DASHBOARD ========== */
function updateDashboard(){
  let tSales=0,tCollected=0,tCost=0,tExp=0;
  clients.forEach(c=>{
    tSales+=c.totalPrice||0;
    tCollected+=(c.downPayment||0)+c.installments.reduce((s,i)=>s+(i.paid||0),0);
    tCost+=c.costPrice||0;
  });
  cashSales.forEach(s=>{tSales+=s.price*(s.qty||1);tCollected+=s.price*(s.qty||1);tCost+=s.cost*(s.qty||1)});
  expenses.forEach(e=>tExp+=e.amount||0);
  const rem=clients.reduce((a,c)=>a+(c.totalPrice-(c.downPayment||0)-c.installments.reduce((s,i)=>s+(i.paid||0),0)),0);
  const monthStr=new Date().toISOString().slice(0,7);
  const monthExp=expenses.filter(e=>(e.date||'').startsWith(monthStr)).reduce((s,x)=>s+x.amount,0);
  document.getElementById('statSales').innerText=formatCurrency(tSales);
  document.getElementById('statCollected').innerText=formatCurrency(tCollected);
  document.getElementById('statRemaining').innerText=formatCurrency(rem);
  document.getElementById('statProfit').innerText=formatCurrency(tCollected-tCost-tExp);
  document.getElementById('statMonthExp').innerText=formatCurrency(monthExp);
  const today=new Date();today.setHours(0,0,0,0);
  const soon=new Date(today);soon.setDate(soon.getDate()+5);
  const up=[];
  clients.forEach(c=>c.installments.forEach(inst=>{
    if(!inst.isPaid){
      const due=new Date(inst.dueDate);
      if(due>=today&&due<=soon)up.push({client:c.name,phone:c.phone,date:inst.dueDate,amount:inst.amount-inst.paid});
    }
  }));
  const ul=document.getElementById('upcomingList');
  ul.innerHTML=up.length?up.map(u=>`<li style="padding:10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><span>${escapeHtml(u.client)} — ${escapeHtml(u.phone)}</span><b>${formatCurrency(u.amount)}</b><span>${u.date}</span></li>`).join(''):'<li style="color:#999;padding:10px">لا توجد أقساط قادمة</li>';
}
function renderCharts(){
  const sc=document.getElementById('salesChart'),ec=document.getElementById('expensesChart');
  if(!sc||!ec)return;
  const cashTotal=cashSales.reduce((s,x)=>s+x.price*(x.qty||1),0);
  const instTotal=clients.reduce((s,x)=>s+(x.totalPrice||0),0);
  if(salesChartInstance)salesChartInstance.destroy();
  salesChartInstance=new Chart(sc,{type:'doughnut',data:{labels:['كاش','تقسيط'],datasets:[{data:[cashTotal,instTotal],backgroundColor:['#2ecc71','#3498db']}]},options:{responsive:true,maintainAspectRatio:false}});
  const byMonth={};
  expenses.forEach(e=>{const m=(e.date||'').slice(0,7);if(m)byMonth[m]=(byMonth[m]||0)+(e.amount||0)});
  const labels=Object.keys(byMonth).sort().slice(-6);
  if(expensesChartInstance)expensesChartInstance.destroy();
  expensesChartInstance=new Chart(ec,{type:'bar',data:{labels:labels.length?labels:['—'],datasets:[{label:'المصروفات',data:labels.length?labels.map(l=>byMonth[l]):[0],backgroundColor:'#e74c3c'}]},options:{responsive:true,maintainAspectRatio:false}});
}

/* ========== SETTINGS ========== */
document.getElementById('settingsForm').addEventListener('submit',e=>{
  e.preventDefault();
  db.collection('stores').doc(currentStoreData._id).update({
    storeName:document.getElementById('settingsStoreName').value.trim(),
    phone:document.getElementById('settingsPhone').value.trim(),
    address:document.getElementById('settingsAddress').value.trim()
  }).then(()=>toast('تم الحفظ','success'));
});

/* ========== BRANCHES ========== */
document.getElementById('branchForm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=document.getElementById('newBranchName').value.trim();
  const address=document.getElementById('newBranchAddress').value.trim();
  if((currentStoreData.branches||[]).some(b=>b.name===name))return toast('اسم الفرع مستخدم','warning');
  db.collection('stores').doc(currentStoreData._id).update({
    branches:firebase.firestore.FieldValue.arrayUnion({
      id:'BR-'+Date.now(),name,address,status:'pending',activationCode:null,price:0,requestedAt:fmtDateTime()
    })
  }).then(()=>{toast('تم إرسال الطلب. تواصل مع المطور لسداد الاشتراك','success');e.target.reset()});
});
function renderBranches(){
  const tbody=document.getElementById('branchesBody');
  if(!tbody)return;
  const branches=currentStoreData.branches||[];
  if(!branches.length){tbody.innerHTML='<tr><td colspan="5"><div class="empty-state"><p>لا توجد فروع</p></div></td></tr>';return}
  tbody.innerHTML=branches.map(b=>{
    let badge='<span class="badge b-yellow">بانتظار</span>';
    if(b.status==='active')badge='<span class="badge b-green">نشط</span>';
    else if(b.status==='inactive')badge='<span class="badge b-red">موقوف</span>';
    const code=b.activationCode?`<b style="font-size:12px;color:#856404">${b.activationCode}</b> (${b.price||0} ج.م)`:'—';
    let action='—';
    if(b.status==='pending'&&b.activationCode){
      action=`<div style="display:flex;gap:5px;justify-content:center"><input type="text" id="code-${b.id}" placeholder="الكود" style="width:110px;padding:5px;border:1px solid var(--border);border-radius:5px;font-size:12px"><button class="btn-icon green" onclick="activateBranch('${b.id}')">تفعيل</button></div>`;
    }else if(b.status==='pending'){
      action='<span style="font-size:11px;color:#856404">بانتظار المطور</span>';
    }else if(b.status==='active'&&b.id!=='main'){
      action=`<button class="btn-icon red" onclick="deactivateBranch('${b.id}')">إيقاف</button>`;
    }else if(b.status==='inactive'){
      action=`<button class="btn-icon green" onclick="activateBranch('${b.id}',true)">إعادة تفعيل</button>`;
    }
    return `<tr><td>${escapeHtml(b.name)}</td><td>${escapeHtml(b.address||'—')}</td><td>${badge}</td><td>${code}</td><td>${action}</td></tr>`;
  }).join('');
}
function activateBranch(id,force){
  db.collection('stores').doc(currentStoreData._id).get().then(doc=>{
    const branches=doc.data().branches.map(b=>{
      if(b.id===id){
        if(!force){
          const code=(document.getElementById(`code-${id}`)?.value||'').trim().toUpperCase();
          if(!b.activationCode||b.activationCode.toUpperCase()!==code)throw new Error('كود غير صحيح');
        }
        return {...b,status:'active',activatedAt:fmtDateTime()};
      }
      return b;
    });
    return db.collection('stores').doc(currentStoreData._id).update({branches});
  }).then(()=>{toast('تم التفعيل','success');})
    .catch(e=>toast(e.message,'error'));
}
function deactivateBranch(id){
  confirmDialog('إيقاف هذا الفرع؟',()=>{
    db.collection('stores').doc(currentStoreData._id).get().then(doc=>{
      const branches=doc.data().branches.map(b=>b.id===id?{...b,status:'inactive'}:b);
      return db.collection('stores').doc(currentStoreData._id).update({branches});
    }).then(()=>toast('تم الإيقاف','success'));
  });
}

/* ========== EMPLOYEES ========== */
document.getElementById('userForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('empEmail').value.trim().toLowerCase();
  const name=document.getElementById('empName').value.trim();
  const phone=document.getElementById('empPhone').value.trim();
  const pass=document.getElementById('empPass').value;
  const role=document.getElementById('empRole').value;
  if(pass.length<6)return toast('كلمة المرور 6 أحرف على الأقل','warning');
  showLoading(true);
  try{
    // إنشاء حساب Firebase Auth في تطبيق ثانوي (بدون تسجيل خروج المالك)
    const secondary=firebase.initializeApp(firebaseConfig,'emp-'+Date.now());
    const secAuth=secondary.auth();
    const {user}=await secAuth.createUserWithEmailAndPassword(email,pass);
    await user.updateProfile({displayName:name});
    // ربط الموظف بالمحل
    await db.collection('employees').doc(user.uid).set({
      authUid:user.uid,storeId:currentStoreData._id,name,phone,email,role,
      branchId:currentBranchId,createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await secAuth.signOut();
    await secondary.delete();
    toast('تمت إضافة الموظف','success');
    e.target.reset();
  }catch(err){toast('خطأ: '+err.message,'error')}
  showLoading(false);
});
function renderUsers(){
  const tbody=document.getElementById('usersBody');
  if(!tbody)return;
  db.collection('employees').where('storeId','==',currentStoreData._id).get().then(snap=>{
    if(snap.empty){tbody.innerHTML='<tr><td colspan="5"><div class="empty-state"><p>لا يوجد موظفون</p></div></td></tr>';return}
    tbody.innerHTML=snap.docs.map(d=>{
      const u=d.data();
      return `<tr><td>${escapeHtml(u.name)}</td><td>${escapeHtml(u.phone||'—')}</td><td>${escapeHtml(u.email)}</td><td><span class="badge b-blue">${ROLES[u.role]?.label||u.role}</span></td><td><button class="btn-icon red" onclick="deleteUser('${d.id}')">حذف</button></td></tr>`;
    }).join('');
  });
}
function deleteUser(id){
  confirmDialog('حذف الموظف؟ (الحساب سيبقى لكن لن يستطيع الدخول)',()=>{
    db.collection('employees').doc(id).delete().then(()=>{toast('تم الحذف','success');renderUsers()});
  });
}

/* ========== CSV EXPORTS ========== */
function exportCashSalesCSV(){
  const rows=[['التاريخ','المنتج','السيريال','العميل','الإجمالي']];
  cashSales.forEach(s=>rows.push([formatDate(s.date),s.productName,s.serial,s.client,s.price*(s.qty||1)]));
  downloadCSV('cash-sales.csv',rows);
}
function exportClientsCSV(){
  const rows=[['العميل','الموبايل','المنتج','الإجمالي','المحصل','المتبقي']];
  clients.forEach(c=>{
    const paid=(c.downPayment||0)+c.installments.reduce((s,i)=>s+(i.paid||0),0);
    rows.push([c.name,c.phone,c.product,c.totalPrice,paid,c.totalPrice-paid]);
  });
  downloadCSV('clients.csv',rows);
}
function exportExpensesCSV(){
  const rows=[['التاريخ','البيان','التصنيف','المبلغ']];
  expenses.forEach(e=>rows.push([e.date,e.desc,e.category||'general',e.amount]));
  downloadCSV('expenses.csv',rows);
}
